<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Servicio - NexoService 360</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>NexoService 360</h1>
    <nav th:replace="~{fragments/navbar :: mainNavbar}"></nav>
</header>
<main>
    <div class="alert" th:if="${alertaError}" th:text="${alertaError}"></div>

    <section class="page-title">
        <h2 th:text="${servicioId == null ? 'Nuevo servicio' : 'Editar servicio'}"></h2>
        <a class="btn secondary" th:href="@{/servicios}">Volver</a>
    </section>

    <form class="form-grid" th:action="${servicioId == null} ? @{/servicios} : @{/servicios/{id}(id=${servicioId})}" th:object="${servicio}" method="post">
        <label class="full">Nombre
            <input th:field="*{nombre}" required maxlength="120">
        </label>
        <label>Precio base
            <input type="number" step="0.01" min="0" th:field="*{precioBase}">
        </label>
        <label>Duracion estimada en minutos
            <input type="number" min="1" th:field="*{duracionEstimadaMinutos}">
        </label>
        <label class="full">Descripcion
            <textarea th:field="*{descripcion}" maxlength="300"></textarea>
        </label>
        <div class="actions full">
            <button type="submit">Guardar</button>
            <a class="btn secondary" th:href="@{/servicios}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
