<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva orden - NexoService 360</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>NexoService 360</h1>
    <nav th:replace="~{fragments/navbar :: mainNavbar}"></nav>
</header>
<main>
    <div class="alert" th:if="${alertaError}" th:text="${alertaError}"></div>

    <section class="page-title">
        <h2>Nueva orden de servicio</h2>
        <a class="btn secondary" th:href="@{/ordenes}">Volver</a>
    </section>

    <form class="form-grid" th:action="@{/ordenes}" th:object="${orden}" method="post">
        <label>Cliente
            <select th:field="*{clienteId}" required>
                <option value="">Seleccione un cliente</option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nombres + ' ' + (cliente.apellidos ?: '')}">
                </option>
            </select>
        </label>
        <label>Equipo
            <select th:field="*{equipoId}" required>
                <option value="">Seleccione un equipo</option>
                <option th:each="equipo : ${equipos}"
                        th:value="${equipo.id}"
                        th:text="${equipo.tipo + ' ' + equipo.marca + ' ' + (equipo.modelo ?: '')}">
                </option>
            </select>
        </label>
        <label>Servicio
            <select th:field="*{servicioId}" required>
                <option value="">Seleccione un servicio</option>
                <option th:each="servicio : ${servicios}"
                        th:value="${servicio.id}"
                        th:text="${servicio.nombre}">
                </option>
            </select>
        </label>
        <label>Tecnico opcional
            <select th:field="*{tecnicoId}">
                <option value="">Sin asignar</option>
                <option th:each="tecnico : ${tecnicos}"
                        th:value="${tecnico.id}"
                        th:text="${tecnico.nombres + ' ' + tecnico.apellidos + ' - ' + tecnico.especialidad}">
                </option>
            </select>
        </label>
        <label>Prioridad
            <select th:field="*{prioridad}">
                <option th:each="prioridad : ${prioridades}" th:value="${prioridad}" th:text="${prioridad}"></option>
            </select>
        </label>
        <label>Fecha estimada
            <input type="date" th:field="*{fechaEstimada}">
        </label>
        <label class="full">Descripcion del problema
            <textarea th:field="*{descripcionProblema}" required maxlength="500"></textarea>
        </label>
        <label class="full">Observaciones
            <textarea th:field="*{observaciones}" maxlength="500"></textarea>
        </label>
        <label>Usuario responsable
            <input th:field="*{usuarioResponsable}" maxlength="120">
        </label>
        <div class="actions full">
            <button type="submit">Crear orden</button>
            <a class="btn secondary" th:href="@{/ordenes}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
