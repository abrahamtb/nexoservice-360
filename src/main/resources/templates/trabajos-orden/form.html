<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trabajo realizado - NexoService 360</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>NexoService 360</h1>
    <nav th:replace="~{fragments/navbar :: mainNavbar}"></nav>
</header>
<main>
    <div class="alert" th:if="${alertaError}" th:text="${alertaError}"></div>

    <section class="page-title">
        <h2 th:text="${trabajoOrdenId == null ? 'Nuevo trabajo realizado' : 'Editar trabajo realizado'}"></h2>
        <a class="btn secondary" th:href="@{/ordenes/{id}(id=${ordenId})}">Volver</a>
    </section>

    <form class="form-grid" th:action="${trabajoOrdenId == null} ? @{/trabajos-orden} : @{/trabajos-orden/{id}(id=${trabajoOrdenId})}" th:object="${trabajoOrden}" method="post">
        <input type="hidden" th:field="*{ordenServicioId}">
        <label>Tecnico responsable
            <select th:field="*{tecnicoId}">
                <option value="">Usar tecnico asignado a la orden</option>
                <option th:each="tecnico : ${tecnicos}"
                        th:value="${tecnico.id}"
                        th:text="${tecnico.nombres + ' ' + tecnico.apellidos}">
                </option>
            </select>
        </label>
        <label>Tiempo invertido (minutos)
            <input type="number" min="1" th:field="*{tiempoInvertidoMinutos}">
        </label>
        <label class="full">Actividad
            <input th:field="*{actividad}" required maxlength="160" placeholder="Limpieza, instalacion, prueba, calibracion">
        </label>
        <label class="full">Detalle del trabajo
            <textarea th:field="*{detalle}" required maxlength="1000"></textarea>
        </label>
        <label class="full">Observaciones
            <textarea th:field="*{observaciones}" maxlength="500"></textarea>
        </label>
        <label>Usuario responsable
            <input th:field="*{usuarioResponsable}" maxlength="120" placeholder="Carlos Ramos">
        </label>
        <div class="actions full">
            <button type="submit">Guardar trabajo</button>
            <a class="btn secondary" th:href="@{/ordenes/{id}(id=${ordenId})}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
