<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tipo de activo - NexoService 360</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>NexoService 360</h1>
    <nav th:replace="~{fragments/navbar :: mainNavbar}"></nav>
</header>
<main>
    <div class="alert" th:if="${alertaError}" th:text="${alertaError}"></div>

    <section class="page-title">
        <h2 th:text="${tipoActivoId == null ? 'Nuevo tipo de activo' : 'Editar tipo de activo'}"></h2>
        <a class="btn secondary" th:href="@{/tipos-activo}">Volver</a>
    </section>

    <form class="form-grid" th:action="${tipoActivoId == null} ? @{/tipos-activo} : @{/tipos-activo/{id}(id=${tipoActivoId})}" th:object="${tipoActivo}" method="post">
        <label class="full">Nombre
            <input th:field="*{nombre}" required maxlength="120" placeholder="Aire acondicionado, vehiculo, equipo medico">
        </label>
        <label class="full">Descripcion
            <textarea th:field="*{descripcion}" maxlength="300" placeholder="Descripcion general del tipo de activo"></textarea>
        </label>
        <div class="actions full">
            <button type="submit">Guardar</button>
            <a class="btn secondary" th:href="@{/tipos-activo}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
