<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto de inventario - NexoService 360</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>NexoService 360</h1>
    <nav th:replace="~{fragments/navbar :: mainNavbar}"></nav>
</header>
<main>
    <div class="alert" th:if="${alertaError}" th:text="${alertaError}"></div>

    <section class="page-title">
        <h2 th:text="${productoId == null ? 'Nuevo producto' : 'Editar producto'}"></h2>
        <a class="btn secondary" th:href="@{/inventario}">Volver</a>
    </section>

    <form class="form-grid" th:action="${productoId == null} ? @{/inventario} : @{/inventario/{id}(id=${productoId})}" th:object="${producto}" method="post">
        <label>Codigo
            <input th:field="*{codigo}" required maxlength="60">
        </label>
        <label>Nombre
            <input th:field="*{nombre}" required maxlength="160">
        </label>
        <label>Categoria
            <input th:field="*{categoria}" maxlength="80">
        </label>
        <label>Unidad
            <input th:field="*{unidadMedida}" maxlength="30">
        </label>
        <label th:if="${productoId == null}">Stock inicial
            <input type="number" min="0" th:field="*{stockInicial}">
        </label>
        <label>Stock minimo
            <input type="number" min="0" th:field="*{stockMinimo}">
        </label>
        <label>Costo unitario
            <input type="number" step="0.01" min="0" th:field="*{costoUnitario}">
        </label>
        <label>Precio referencia
            <input type="number" step="0.01" min="0" th:field="*{precioReferencia}">
        </label>
        <label class="full">Descripcion
            <textarea th:field="*{descripcion}" maxlength="300"></textarea>
        </label>
        <div class="actions full">
            <button type="submit">Guardar</button>
            <a class="btn secondary" th:href="@{/inventario}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
