<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consulta activos - NexoService 360</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>NexoService 360</h1>
    <nav th:replace="~{fragments/navbar :: mainNavbar}"></nav>
</header>
<main>
    <section class="page-title">
        <h2>Consulta de activos por cliente</h2>
    </section>

    <form class="toolbar" th:action="@{/consultas/equipos-por-cliente}" method="get">
        <select name="clienteId" required>
            <option value="">Seleccione un cliente</option>
            <option th:each="cliente : ${clientes}"
                    th:value="${cliente.id}"
                    th:selected="${clienteId != null && cliente.id == clienteId}"
                    th:text="${cliente.nombres + ' ' + (cliente.apellidos ?: '')}">
            </option>
        </select>
        <button type="submit">Consultar</button>
    </form>

    <table th:if="${equipos != null}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Serie</th>
            <th>Codigo</th>
            <th>Ubicacion</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td th:text="${equipo.id()}"></td>
            <td th:text="${equipo.tipo()}"></td>
            <td th:text="${equipo.marca()}"></td>
            <td th:text="${equipo.modelo()}"></td>
            <td th:text="${equipo.numeroSerie()}"></td>
            <td th:text="${equipo.codigoInterno()}"></td>
            <td th:text="${equipo.ubicacion()}"></td>
            <td><span class="status" th:text="${equipo.estado()}"></span></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
