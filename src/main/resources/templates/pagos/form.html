<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo pago - NexoService 360</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>NexoService 360</h1>
    <nav th:replace="~{fragments/navbar :: mainNavbar}"></nav>
</header>
<main>
    <div class="alert" th:if="${alertaError}" th:text="${alertaError}"></div>

    <section class="page-title">
        <h2>Nuevo pago</h2>
        <a class="btn secondary" th:href="@{/pagos}">Volver</a>
    </section>

    <form class="form-grid" th:action="@{/pagos}" th:object="${pago}" method="post">
        <label>Orden de servicio
            <select th:field="*{ordenServicioId}" required>
                <option value="">Seleccionar</option>
                <option th:each="orden : ${ordenes}" th:value="${orden.id()}" th:text="${orden.etiqueta()}"></option>
            </select>
        </label>
        <label>Cotizacion ID
            <input type="number" min="1" th:field="*{cotizacionId}">
        </label>
        <label>Monto
            <input type="number" min="0.01" step="0.01" th:field="*{monto}" required>
        </label>
        <label>Metodo
            <select th:field="*{metodoPago}">
                <option th:each="metodo : ${metodosPago}" th:value="${metodo}" th:text="${metodo}"></option>
            </select>
        </label>
        <label>Numero operacion
            <input th:field="*{numeroOperacion}" maxlength="80">
        </label>
        <label>Responsable
            <input th:field="*{usuarioResponsable}" maxlength="120">
        </label>
        <label class="full">Observaciones
            <textarea th:field="*{observaciones}" maxlength="500"></textarea>
        </label>
        <div class="actions full">
            <button type="submit">Registrar pago</button>
            <a class="btn secondary" th:href="@{/pagos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
