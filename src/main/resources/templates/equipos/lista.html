<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activos - NexoService 360</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header>
    <h1>NexoService 360</h1>
    <nav th:replace="~{fragments/navbar :: mainNavbar}"></nav>
</header>
<main>
    <div class="alert" th:if="${alertaError}" th:text="${alertaError}"></div>
    <div class="alert success" th:if="${alertaExito}" th:text="${alertaExito}"></div>

    <section class="page-title">
        <h2>Activos</h2>
        <a class="btn" th:href="@{/equipos/nuevo}">Nuevo activo</a>
    </section>

    <form class="toolbar" th:action="@{/equipos}" method="get">
        <input type="search" name="buscar" placeholder="Buscar por tipo, marca, modelo, serie, codigo o ubicacion" th:value="${buscar}">
        <button type="submit">Buscar</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Activo</th>
            <th>Serie</th>
            <th>Codigo</th>
            <th>Ubicacion</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td th:text="${equipo.id()}"></td>
            <td th:text="${equipo.clienteNombre()}"></td>
            <td th:text="${equipo.tipo() + ' ' + equipo.marca() + ' ' + (equipo.modelo() ?: '')}"></td>
            <td th:text="${equipo.numeroSerie()}"></td>
            <td th:text="${equipo.codigoInterno()}"></td>
            <td th:text="${equipo.ubicacion()}"></td>
            <td><span class="status" th:text="${equipo.estado()}"></span></td>
            <td class="actions">
                <a class="btn secondary" th:href="@{/equipos/{id}/editar(id=${equipo.id()})}">Editar</a>
                <form th:action="@{/equipos/{id}/inactivar(id=${equipo.id()})}" method="post">
                    <button class="danger" type="submit">Inactivar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
